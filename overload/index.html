  <div class="app">
    <aside class="sidebar">
      <div class="logo"><span class="logo-mark"><i></i><i></i><i></i><b></b></span>Overload</div>
      <button class="btn btn-primary btn-block add-btn" data-action="add"><svg class="icon s16"><use href="#i-plus"/></svg>Add assignment</button>
      <nav class="nav" aria-label="Main">
        <button class="nav-btn" data-view="today"><svg class="icon"><use href="#i-sun"/></svg>Today</button>
        <button class="nav-btn" data-view="plan"><svg class="icon"><use href="#i-calendar-days"/></svg>Plan</button>
        <button class="nav-btn" data-view="checkins"><svg class="icon"><use href="#i-smile"/></svg>Check-ins</button>
        <button class="nav-btn" data-view="settings"><svg class="icon"><use href="#i-settings-2"/></svg>Settings</button>
      </nav>
      <div class="side-foot">
        <button class="timer-pill hidden" data-action="goto-focus"></button>
        <div class="pillseg" data-theme-seg>
          <button data-theme="light"><svg class="icon s14"><use href="#i-sun"/></svg>Light</button>
          <button data-theme="dark"><svg class="icon s14"><use href="#i-moon"/></svg>Dark</button>
        </div>
        <div class="privacy"><svg class="icon"><use href="#i-lock"/></svg><span><b>Private by design.</b> No account. Everything stays on this device.</span></div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="logo"><span class="logo-mark"><i></i><i></i><i></i><b></b></span>Overload</div>
        <div class="right">
          <button class="timer-pill hidden" data-action="goto-focus"></button>
          <button class="icon-circle" data-action="toggle-theme" aria-label="Switch light or dark mode"><svg class="icon s16" id="theme-icon"><use href="#i-moon"/></svg></button>
          <button class="icon-circle solid" data-action="add" aria-label="Add assignment"><svg class="icon s16"><use href="#i-plus"/></svg></button>
        </div>
      </header>
      <main>
        <section class="view" id="view-today"></section>
        <section class="view" id="view-plan"></section>
        <section class="view" id="view-checkins"></section>
        <section class="view" id="view-settings"></section>
        <section class="view" id="view-risk"></section>
      </main>
    </div>
  </div>

  <div class="welcome hidden" id="welcome"></div>
  <div id="dialog-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
